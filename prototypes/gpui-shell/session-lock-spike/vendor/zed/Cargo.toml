[workspace]
resolver = "2"
members = ["crates/gpui", "crates/gpui_linux"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
accesskit = { version = "0.24.0", features = ["enumn"] }
accesskit_unix = "0.22"
anyhow = "1.0.86"
ashpd = { version = "0.13", default-features = false, features = ["async-io", "inhibit", "open_uri", "file_chooser", "settings"] }
async-channel = { version = "2.5", default-features = false }
async-task = "4.7"
async-tungstenite = "0.33"
backtrace = "0.3"
bench_metrics = { git = "https://github.com/zed-industries/zed", rev = "56934ec0560bce8929025497411de7f5322fb6ca" }
bitflags = "2.6.0"
bytemuck = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
collections = { version = "0.1.0", git = "https://github.com/zed-industries/zed", rev = "56934ec0560bce8929025497411de7f5322fb6ca" }
criterion = { version = "0.8.2", features = ["html_reports"] }
ctor = "1.0.12"
derive_more = { version = "2.1", features = ["deref", "deref_mut", "from_str"] }
env_logger = "0.11"
etagere = "0.2"
futures = "0.3.34"
futures-concurrency = "7.7.1"
gpui = { default-features = false, path = "crates/gpui" }
gpui_macros = { git = "https://github.com/zed-industries/zed", rev = "56934ec0560bce8929025497411de7f5322fb6ca" }
gpui_platform = { default-features = false, git = "https://github.com/zed-industries/zed", rev = "56934ec0560bce8929025497411de7f5322fb6ca" }
gpui_shared_string = { git = "https://github.com/zed-industries/zed", rev = "56934ec0560bce8929025497411de7f5322fb6ca" }
gpui_util = { git = "https://github.com/zed-industries/zed", rev = "56934ec0560bce8929025497411de7f5322fb6ca" }
gpui_wgpu = { git = "https://github.com/zed-industries/zed", rev = "56934ec0560bce8929025497411de7f5322fb6ca" }
hdrhistogram = { version = "7", default-features = false }
heapless = "0.9.2"
http_client = { git = "https://github.com/zed-industries/zed", rev = "56934ec0560bce8929025497411de7f5322fb6ca" }
image = { version = "0.25.1", default-features = false, features = ["bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "rayon", "tga", "tiff", "webp"] }
inventory = "0.3.19"
itertools = "0.14.0"
libc = "0.2"
log = { version = "0.4", default-features = false, features = ["std"] }
notify-rust = "4"
objc2 = "0.6"
objc2-core-foundation = { version = "=0.3.2", default-features = false }
objc2-core-video = { version = "=0.3.2", default-features = false, features = ["CVBuffer", "CVImageBuffer"] }
oo7 = { version = "0.6", default-features = false }
parking_lot = "0.12.1"
pollster = "0.4.0"
postage = { version = "0.5", default-features = false }
profiling = "1"
proptest = { git = "https://github.com/proptest-rs/proptest", rev = "3dca198a8fef1b32e3a66f1e1897c955b4dc5b5b", features = ["attr-macro"] }
rand = { version = "0.9", default-features = false, features = ["std", "std_rng", "os_rng"] }
raw-window-handle = "0.6"
refineable = { git = "https://github.com/zed-industries/zed", rev = "56934ec0560bce8929025497411de7f5322fb6ca" }
regex = { version = "1.5", default-features = false, features = ["std", "perf"] }
reqwest_client = { git = "https://github.com/zed-industries/zed", rev = "56934ec0560bce8929025497411de7f5322fb6ca" }
resvg = { version = "0.46.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }
scap = { git = "https://github.com/zed-industries/scap", rev = "4afea48c3b002197176fb19cd0f9b180dd36eaac", default-features = false, package = "zed-scap", version = "0.0.8-zed" }
scheduler = { git = "https://github.com/zed-industries/zed", rev = "56934ec0560bce8929025497411de7f5322fb6ca" }
schemars = { version = "1.0", default-features = false, features = ["std", "indexmap2"] }
serde = { version = "1.0", features = ["rc"] }
serde_json = { version = "1.0.144", features = ["preserve_order", "raw_value"] }
slotmap = "1.0.6"
smallvec = { version = "1.6", features = ["union", "const_new"] }
smol = "2.0"
spin = { version = "0.10", default-features = false, features = ["mutex", "spin_mutex", "lock_api"] }
stacksafe = "1.0"
strum = { version = "0.28", features = ["derive"] }
sum_tree = { git = "https://github.com/zed-industries/zed", rev = "56934ec0560bce8929025497411de7f5322fb6ca" }
taffy = { version = "=0.13.0", default-features = false }
thiserror = "2.0.12"
unicode-segmentation = "1.10"
url = "2.2"
usvg = { version = "0.46.0", default-features = false }
util_macros = { git = "https://github.com/zed-industries/zed", rev = "56934ec0560bce8929025497411de7f5322fb6ca" }
uuid = { version = "1.1", features = ["serde"] }
wasm-bindgen = "0.2.120"
web-sys = "0.3"
web-time = "1.1.0"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Ole", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging"] }
xkbcommon = { version = "0.8", default-features = false }
